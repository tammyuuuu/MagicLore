const entry=document.getElementById('entry'),report=document.getElementById('report'),matchView=document.getElementById('matchView'),archiveView=document.getElementById('archiveView'),C=NumerologyContent;let result,selectedDigit=7,selectedYear=new Date().getFullYear();const path=n=>n.steps.join(' / '),info=n=>C.number(n),ageNow=d=>{const now=new Date();let a=now.getFullYear()-d.year;if(now.getMonth()+1<d.month||(now.getMonth()+1===d.month&&now.getDate()<d.day))a--;return a};const defaultEnergyDigit=()=>{const max=Math.max(...Object.values(result.birthFrequency)),ties=Object.entries(result.birthFrequency).filter(([,v])=>v===max).map(([n])=>+n),birthday=result.birthday.value;return ties.includes(birthday)?birthday:Math.min(...ties)};function switchView(view){document.querySelectorAll('.tool[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));matchView.classList.toggle('open',view==='match');archiveView.classList.toggle('open',view==='archive');if(view==='life'){if(result){report.classList.add('open');entry.classList.add('hidden')}else{report.classList.remove('open');entry.classList.remove('hidden')}}else{report.classList.remove('open');entry.classList.add('hidden')}window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('.tool[data-view]').forEach(button=>button.onclick=()=>switchView(button.dataset.view));
function render(){const life=info(result.lifePath.value),lifeCopy=C.lifePath(result.lifePath.value,result.lifePath.steps),present=Object.entries(result.birthFrequency).filter(([,v])=>v).map(([n])=>n).join(' · '),relation=C.coreRelation(result.lifePath.value,result.coreRelation.frequency,present,result.lifePath.steps),integrated=C.integrated(result),yearCopy=C.personalYear(result.personalYear.value,result.personalYear.year),age=ageNow(result.date),date=result.date.iso.replaceAll('-',' · ');const aux=[['生日数',result.birthday,'birthday'],['态度数',result.attitude,'attitude'],['出生年数',result.birthYear,'birthYear']];report.innerHTML=`<header class="report-head"><div><div class="date-label">${date}</div><p>完整生命灵数报告</p></div><button class="soft-btn" id="editDate">修改日期</button></header><section style="margin-top:28px;padding:24px;border:1px solid var(--line);background:rgba(73,42,85,.12)"><div class="eyebrow">HOW TO READ · 先看懂你的数字</div><p class="intro">这些数字不是互相矛盾的人格答案，而是在回答不同问题。</p><div class="aux-grid"><div class="aux"><b>生命路径</b><p>人生主线：这一生反复需要发展什么？</p></div><div class="aux"><b>生日数</b><p>自然天赋：什么对你来说比较顺手？</p></div><div class="aux"><b>态度数</b><p>第一反应：遇到事情时通常先怎么回应？</p></div><div class="aux"><b>出生数字</b><p>原始工具箱：哪些方式用得多，哪些要后天发展？</p></div><div class="aux"><b>人生周期</b><p>当前章节：这个阶段更强调什么？</p></div><div class="aux"><b>个人流年</b><p>今年天气：今年更值得关注什么？</p></div></div><p class="muted">阅读权重：长期主线 ＞ 出生结构 ＞ 辅助数字 ＞ 阶段数字 ＞ 年度数字。流年不会覆盖生命路径，人生周期也不会让你变成另一个数字。</p></section>
<section class="section" id="core"><div class="section-number">01</div><div class="eyebrow">LIFE CORE</div><h2>生命核心</h2><div class="core-layout"><div class="core-orbit"><div class="path">${path(result.lifePath)}<small>生命路径</small></div></div><div><h2>${lifeCopy.title}</h2><div class="keywords">${life.keywords.map(x=>`<span>${x}</span>`).join('')}</div><div class="subhead">你的生命主线</div><p class="intro">${lifeCopy.lead}</p>${lifeCopy.compound?`<p class="intro">${lifeCopy.compound}</p>`:''}</div></div><div class="meaning-grid"><div class="meaning"><h3>你的优势</h3><p>${lifeCopy.strength}</p></div><div class="meaning"><h3>需要留意</h3><p>${lifeCopy.shadow}</p></div><div class="meaning"><h3>成长方向</h3><p>${lifeCopy.growth}</p></div></div><div class="aux-grid">${aux.map(([label,n,key])=>{const copy=C.position(key,n.value);return`<div class="aux"><b>${path(n)}</b><h3>${label} · ${n.value}${[11,22,33].includes(n.value)?' · 大师数字':''}</h3><p>${copy.lead}</p></div>`}).join('')}</div></section>
<section class="section" id="overview"><div class="section-number">02</div><div class="eyebrow">YOUR STRUCTURE</div><h2>一句话看懂你的结构</h2><div style="padding:28px;border-left:2px solid var(--gold);background:rgba(82,47,95,.16)"><p class="intro">${integrated.summary}</p><div class="aux-grid"><div class="aux"><b>${integrated.dominant?.number||'—'} ×${integrated.dominant?.count||0}</b><p>出生结构中最醒目的数字</p></div><div class="aux"><b>${integrated.secondary?.number||'—'} ×${integrated.secondary?.count||0}</b><p>次强出生数字</p></div><div class="aux"><b>${result.lifePath.value}</b><p>最重要的长期生命路径</p></div></div></div></section><section class="section" id="dynamics"><div class="section-number">03</div><div class="eyebrow">NUMBER DYNAMICS</div><h2>你的数字是怎样一起工作的</h2><p class="intro">你从出生数字这个“原始工具箱”出发，用生日数与态度数处理日常经验，最后朝生命路径所指的方向发展。不同数字之间会互相支持，也会形成需要平衡的张力。</p>${integrated.relations.map(r=>`<article style="padding:22px;border-top:1px solid var(--line);background:rgba(21,12,27,.5)"><h3 class="subhead">${r.source} → ${r.target} · ${r.type}｜${r.title}</h3><p class="intro">${r.text}</p><p class="intro"><b>整合得好时：</b>${r.integration}</p></article>`).join('')}</section><section class="section" id="energy"><div class="section-number">04</div><div class="eyebrow">BIRTH DIGIT FREQUENCY</div><h2>你的出生日期里，哪些数字最常出现？</h2><p class="intro">把出生日期拆开后，有些数字会重复出现，有些完全没有出现。在灵数里，重复的数字被看作你更容易反复使用的倾向；没有出现的数字，则更像需要通过经验慢慢发展的部分。数字多不代表更好，空缺也不代表缺点。</p><details class="evidence"><summary>查看计算方法</summary><p>只统计公历出生日期 ${result.date.iso} 中实际出现的 1～9，数字 0 不计入。</p></details><div class="energy-layout"><div class="star-field">${Object.entries(result.birthFrequency).map(([n,count],i)=>{const col=i%3,row=Math.floor(i/3),x=18+col*32,y=21+row*29;return`<button class="digit-star ${count?'present':''} ${count>=3?'strong':''}" data-digit="${n}" data-count="${Math.min(count,4)}" style="left:${x}%;top:${y}%"><b>${n}</b>${count?`<em>${C.concentration[Math.min(count,4)]}</em>`:''}<i></i></button>`}).join('')}</div><div class="detail-panel" id="energyDetail"></div></div><div class="missing">空缺数字　<b>${result.missing.join(' · ')}</b><br>空缺不代表你没有这些能力，只表示它们没有被出生日期里的重复数字加强。</div></section>
<section class="section" id="growth"><div class="section-number">03</div><div class="eyebrow">CORE RELATION</div><h2>${relation.question}</h2><div class="growth-visual"><div class="growth-node">你的出生日期里有<b>${present}</b></div><div class="growth-arrow">→</div><div class="growth-node">你的生命路径<b>${result.lifePath.value}</b></div></div><h3 class="subhead">${relation.label} · ${result.lifePath.value}</h3><p class="intro">${relation.text}</p><details class="evidence"><summary>查看计算依据</summary><p>${relation.evidence}</p></details></section>
<section class="section" id="cycles"><div class="section-number">04</div><div class="eyebrow">LIFE CYCLES</div><h2>人生周期</h2><div class="meaning-grid"><div class="meaning"><h3>人生高峰周期 <small>PINNACLES</small></h3><p>这里的“高峰”不是好运或人生巅峰，而是不同年龄阶段更容易成为主线的内容。</p></div><div class="meaning"><h3>阶段挑战 <small>CHALLENGES</small></h3><p>挑战数也不是坏运，而是这个阶段更容易反复遇到、需要学习处理的课题。</p></div><div class="meaning"><h3>怎样阅读</h3><p>点击一个阶段，同时阅读它的主数字与阶段挑战。</p></div></div><div class="timeline">${result.pinnacles.map((n,i)=>{const [s,e]=result.pinnacleAges[i],active=age>=s&&(e===null||age<=e);return`<button class="era ${active?'current':''}" data-era="${i}"><span class="node">${n}</span><small>${s===0?'出生':s}～${e===null?'以后':e+'岁'}<br>${info(n).title}</small></button>`}).join('')}</div><div class="challenge-line">${result.challenges.map(n=>`<div>阶段挑战<b>${n}</b></div>`).join('')}</div><div class="cycle-detail" id="cycleDetail"></div></section>
<section class="section" id="year"><div class="section-number">05</div><div class="eyebrow">PERSONAL YEAR</div><h2>你今年正在经历什么主题？</h2><div class="year-layout"><div><div class="nm-year-inline"><b class="nm-year-digit">${result.personalYear.value}</b><div class="keywords">${info(result.personalYear.value).keywords.map(x=>`<span>${x}</span>`).join('')}</div></div><p class="intro">${yearCopy.lead}</p><div class="subhead">今年可以关注</div><p class="intro">${yearCopy.focus}</p><div class="subhead">需要留意</div><p class="intro">${yearCopy.watch}</p><p class="muted">${yearCopy.note}</p></div></div></section>
<section class="section" id="atlas"><div class="section-number">06</div><div class="eyebrow">NUMBER ATLAS</div><h2>1～9 数字图鉴</h2><p class="intro">选择数字，阅读它的核心原型、优势、阴影、成长方向及不同出现浓度。</p><div class="digit-selector">${Array.from({length:9},(_,i)=>`<button data-atlas="${i+1}">${i+1}</button>`).join('')}</div><div class="atlas-detail" id="atlasDetail"></div></section>`;
[['energy','04'],['growth','05'],['cycles','06'],['year','07'],['atlas','08']].forEach(([id,n])=>{const el=report.querySelector(`#${id} .section-number`);if(el)el.textContent=n});report.querySelectorAll('details.evidence').forEach(el=>el.remove());report.querySelectorAll('.digit-star').forEach(b=>{const count=result.birthFrequency[b.dataset.digit],label=b.querySelector('em');if(label)label.textContent=`×${count}`;b.onclick=()=>showEnergy(+b.dataset.digit)});report.querySelectorAll('.era').forEach(b=>b.onclick=()=>showCycle(+b.dataset.era));report.querySelectorAll('[data-atlas]').forEach(b=>b.onclick=()=>showAtlas(+b.dataset.atlas));document.getElementById('editDate').onclick=()=>{report.classList.remove('open');entry.classList.remove('hidden')};selectedYear=new Date().getFullYear();renderYear();showEnergy(defaultEnergyDigit());showCycle(0);showAtlas(7)}
function renderYear(){const current=new Date().getFullYear(),annual=Numerology.calculate(result.date.iso,selectedYear).personalYear,copy=C.personalYear(annual.value,selectedYear),position=selectedYear===current?'今年':selectedYear===current-1?'上一年':selectedYear===current+1?'下一年':selectedYear<current?'过去年份':'未来年份',section=report.querySelector('#year');section.style.opacity='.35';setTimeout(()=>{section.innerHTML=`<div class="section-number">07</div><div class="eyebrow">PERSONAL YEAR</div><h2>流年</h2><div style="display:flex;align-items:center;justify-content:center;gap:22px;margin:20px 0"><button class="soft-btn" id="prevYear" title="上一年">←</button><div class="date-label">${selectedYear}<small style="display:block;text-align:center;font-size:10px;letter-spacing:2px">${position}</small></div><button class="soft-btn" id="nextYear" title="下一年">→</button></div><div class="year-layout"><div><div class="nm-year-inline"><b class="nm-year-digit">${annual.value}</b><div class="keywords">${info(annual.value).keywords.map(x=>`<span>${x}</span>`).join('')}</div></div><p class="intro">${copy.lead}</p><div class="subhead">这一年可以关注</div><p class="intro">${copy.focus}</p><div class="subhead">需要留意</div><p class="intro">${copy.watch}</p><div class="subhead">这一年与你的长期主线</div><p class="intro">${C.yearConnection(result.lifePath.value,annual.value)}</p><p class="muted">${copy.note} 个人流年按照1～9循环，每一年强调不同内容。</p></div></div>`;section.querySelector('#prevYear').onclick=()=>{selectedYear--;renderYear()};section.querySelector('#nextYear').onclick=()=>{selectedYear++;renderYear()};section.style.transition='opacity .24s ease,transform .24s ease';section.style.opacity='1'},120)}
function showEnergy(n){selectedDigit=n;const count=result.birthFrequency[n],d=info(n),max=Math.max(...Object.values(result.birthFrequency)),copy=C.frequency(n,count,{isHighest:count===max});document.getElementById('energyDetail').innerHTML=`<div class="giant">${copy.heading}</div><h3>${copy.subtitle}</h3><p>${copy.reason}</p><div class="keywords">${d.keywords.map(x=>`<span>${x}</span>`).join('')}</div>${copy.sections.map(([title,text])=>`<div class="subhead">${title}</div><p>${text}</p>`).join('')}`}
function showCycle(i){report.querySelectorAll('.era').forEach((e,n)=>e.classList.toggle('selected',n===i));const n=result.pinnacles[i],c=result.challenges[i],[s,e]=result.pinnacleAges[i],d=info(n);document.getElementById('cycleDetail').innerHTML=`<h3>第${['一','二','三','四'][i]}阶段 · ${s===0?'出生':s}～${e===null?'以后':e+'岁'}</h3><div class="keywords">${d.keywords.map(x=>`<span>${x}</span>`).join('')}</div><p><b>人生高峰周期 ${n} · ${d.title}</b><br>${C.pinnacle(n)}</p><p><b>阶段挑战 ${c}</b><br>${C.challenge(c)}</p><p><b>它与你的核心结构有什么关系</b><br>${C.cycleConnection(result.lifePath.value,n)}</p>`}
function showAtlas(n){report.querySelectorAll('[data-atlas]').forEach(b=>b.classList.toggle('active',+b.dataset.atlas===n));const d=info(n);document.getElementById('atlasDetail').innerHTML=`<h3>数字 ${n} · ${d.title}</h3><div class="keywords">${d.keywords.map(x=>`<span>${x}</span>`).join('')}</div><div class="atlas-detail-grid"><p><b>核心原型</b><br>${d.archetype}</p><p><b>发挥得好时</b><br>${d.strength}</p><p><b>走得太重时</b><br>${d.shadow}</p><p><b>成长方向</b><br>${d.growth}</p><p><b>空缺时</b><br>${C.frequency(n,0).sections[1][1]}</p><p><b>出现浓度</b><br>1次＝存在；2次＝突出；3次＝强化；4次以上＝高浓度。浓度不是能力等级。</p></div>`}
birthForm.onsubmit=e=>{e.preventDefault();try{result=Numerology.calculate(birthDate.value,new Date().getFullYear());render();entry.classList.add('hidden');report.classList.add('open');window.scrollTo({top:0,behavior:'instant'});error.textContent=''}catch(err){error.textContent=err.message}};
</script><script src="relationship_ui.js?v=9"></script><style>.archive-tabs button{padding:6px 20px;border:1px solid var(--vline);border-radius:16px;background:transparent;color:#9d89a8;font:inherit;font-size:12px;cursor:pointer}.archive-tabs button.active{border-color:var(--gold);color:var(--gold2)}.archive-pane{display:none}.archive-pane.open{display:block}.personal-actions{margin-left:auto}.archive-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}.archive-delete{padding:0 14px;border:1px solid rgba(198,112,127,.32);background:rgba(73,28,41,.18);color:#c98c98;font:inherit;font-size:11px;letter-spacing:1px;cursor:pointer}.archive-delete:hover{border-color:#c98c98;color:#e4abb6}</style></body></html>
